syntax = "proto3";
package kratos.api;

option go_package = "goods/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
    Server server = 1;
    Data data     = 2;
    Trace trace   = 3;
}

message Server {
    message HTTP {
        string network                   = 1;
        string addr                      = 2;
        google.protobuf.Duration timeout = 3;
    }
    message GRPC {
        string network                   = 1;
        string addr                      = 2;
        google.protobuf.Duration timeout = 3;
    }
    HTTP http = 1;
    GRPC grpc = 2;
}

message Data {
    message Mysql {
        string driver  = 1;
        string source  = 2;
        int32 max_idle = 3;
        int32 max_open = 4;
    }
    message Redis {
        string network                         = 1;
        string addr                            = 2;
        string password                        = 3;
        int32 db                               = 4;
        google.protobuf.Duration dial_timeout  = 5;
        google.protobuf.Duration read_timeout  = 6;
        google.protobuf.Duration write_timeout = 7;
    }
    message ElasticSearch {
        string addr     = 1;
        string username = 2;
        string password = 3;
        bytes ca_cert   = 4;
    }
    Mysql mysql                  = 1;
    Redis redis                  = 2;
    ElasticSearch elastic_search = 3;
}

message Trace {
    string endpoint = 1;
}

message Registry {
    message Consul {
        string address = 1;
        string scheme  = 2;
    }
    Consul consul = 1;
}